[project]
name = "nextread"
version = "0.1.0"
description = "An explainable book recommendation platform"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "scikit-learn>=1.6,<2", "certifi>=2024.2.2", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
